version: 2
updates:
  # Maven dependencies for every module (root aggregator + the three Spring Boot apps)
  - package-ecosystem: maven
    directories:
      - "/"
      - "/blocking-caller"
      - "/echo-service"
      - "/reactive-caller"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework:*"
      observability:
        patterns:
          - "io.micrometer*"
          - "io.opentelemetry*"
          - "io.github.digma-ai*"
      test:
        dependency-type: development
        patterns:
          - "*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.codehaus.mojo*"

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
